<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#d2f000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background with rounded corners and neon border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#d2f000" stroke-width="24" filter="url(#glow)"/>
  
  <!-- Lightning bolt / Streetwear accent -->
  <path d="M280 64 L200 240 L280 240 L232 448 L360 216 L280 216 Z" fill="#d2f000" opacity="0.15"/>
  
  <!-- "CC" High Contrast Typography -->
  <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="220" font-weight="900" fill="#d2f000" text-anchor="middle" letter-spacing="-12" filter="url(#glow)">
    CC
  </text>
  
  <!-- Bottom Accent Tag -->
  <rect x="176" y="380" width="160" height="18" rx="9" fill="#d2f000" />
</svg>
